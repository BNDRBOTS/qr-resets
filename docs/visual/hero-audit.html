<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;font-family:Inter,Arial,sans-serif;background:#F3EDE6;color:#111111}body{min-height:100vh}
header{height:68px;border-bottom:1px solid rgba(23,21,17,.13);display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:rgba(241,237,227,.94)}
.brand{display:flex;align-items:center;gap:14px}.logo{width:69px;height:18px;object-fit:contain;filter:invert(1)}
.switch{display:flex;border:1px solid rgba(23,21,17,.18);border-radius:999px;padding:3px;background:rgba(255,255,255,.34);font-size:12px}.switch b,.switch span{padding:8px 13px;border-radius:999px}.switch b{background:#171511;color:#f1ede3}
main{min-height:calc(100vh - 68px);display:flex;align-items:center;justify-content:center;text-align:center;padding:56px 24px;position:relative;overflow:hidden}
.circle{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:min(70vmin,680px);height:min(70vmin,680px);border-radius:50%;background:radial-gradient(circle,rgba(49,95,143,.20),rgba(49,95,143,.05) 48%,transparent 72%);filter:blur(30px)}
.content{position:relative;max-width:900px}.hero-logo{width:175px;height:46px;object-fit:contain;margin:auto}.eyebrow{letter-spacing:.28em;text-transform:uppercase;font-size:11px;margin-top:18px;color:#111111;font-weight:700}
h1{font-size:clamp(36px,7vw,88px);letter-spacing:-.055em;line-height:.98;margin:18px 0 22px}p{font-size:20px;line-height:1.55;max-width:700px;margin:0 auto;color:#35312b}.buttons{display:flex;justify-content:center;gap:12px;margin-top:32px}.btn{padding:14px 22px;border-radius:12px;border:1px solid #171511;font-weight:750;font-size:13px}.btn.primary{background:#171511;color:#f1ede3}
@media(max-width:600px){header{height:64px;padding:0 12px;gap:8px}.logo{width:58px;height:auto}.switch{font-size:10.5px;flex-shrink:0}.switch b,.switch span{padding:7px 8px;white-space:nowrap}main{min-height:calc(100vh - 64px);padding:38px 18px;align-items:flex-start}.content{padding-top:68px}.hero-logo{width:152px;height:40px}p{font-size:17px}.buttons{flex-direction:column}.btn{width:100%}}
</style></head><body>
<header><div class="brand"><img class="logo" src="../../public/bndr-logo-black.png" alt="BNDR"></div><div class="switch"><span>Resource Directory</span><b>QR Resets</b></div></header>
<main><div class="circle"></div><div class="content"><img class="hero-logo" src="../../public/bndr-logo-black.png" alt="BNDR"><div class="eyebrow">QR Resets™</div><h1>One scan. One dollar.<br>One real Reset.</h1><p>Flexible, person-directed help before a temporary crisis becomes permanent collapse.</p><div class="buttons"><div class="btn primary">GIVE $1 A MONTH</div><div class="btn">REQUEST A RESET</div></div></div></main>
</body></html>
