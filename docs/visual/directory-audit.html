<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;font-family:Inter,Arial,sans-serif;background:#F3EDE6;color:#111111}body{min-height:100vh}
header{height:68px;border-bottom:1px solid rgba(23,21,17,.13);display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:rgba(243,237,230,.94)}
.logo{width:72px;height:auto;object-fit:contain;filter:invert(1)}.right{display:flex;align-items:center;gap:10px}.switch{display:flex;border:1px solid rgba(23,21,17,.18);border-radius:999px;padding:3px;background:rgba(255,255,255,.34);font-size:12px}.switch b,.switch span{padding:8px 13px;border-radius:999px}.switch b{background:#111;color:#F9F4EE}.admin{font-size:11px;border:1px solid rgba(17,17,17,.18);padding:8px 10px;border-radius:9px}
main{min-height:calc(100vh - 68px);display:flex;align-items:center;justify-content:center;text-align:center;padding:56px 24px;position:relative;overflow:hidden}.circle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(70vmin,680px);height:min(70vmin,680px);border-radius:50%;background:radial-gradient(circle,rgba(49,95,143,.17),rgba(49,95,143,.045) 48%,transparent 72%);filter:blur(30px)}
.content{position:relative;width:min(760px,100%)}.hero-logo{width:min(400px,52vw);height:auto;object-fit:contain;margin:auto}.tagline{font-size:18px;line-height:1.5;margin:28px auto 32px;max-width:660px}.search{height:58px;border:1px solid rgba(17,17,17,.25);border-radius:15px;background:rgba(255,255,255,.52);display:flex;align-items:center;padding:0 18px;text-align:left;color:#686057;font-size:15px;box-shadow:0 14px 42px rgba(49,95,143,.08)}.meta{display:flex;justify-content:center;gap:10px;margin-top:14px;font-size:11px}.pill{border:1px solid rgba(17,17,17,.18);border-radius:999px;padding:8px 12px;background:rgba(255,255,255,.25)}
@media(max-width:600px){header{height:64px;padding:0 12px;gap:8px}.logo{width:60px}.right{gap:6px}.admin{display:none}.switch{font-size:10.5px;flex-shrink:0}.switch b,.switch span{padding:7px 8px;white-space:nowrap}main{min-height:calc(100vh - 64px);padding:38px 18px;align-items:flex-start}.content{padding-top:88px}.hero-logo{width:230px}.tagline{font-size:16px;margin:24px auto}.search{height:54px}.meta{flex-wrap:wrap}}
</style></head><body><header><img class="logo" src="../../public/bndr-logo-black.png" alt="BNDR"><div class="right"><div class="switch"><b>Directory</b><span>QR Resets</span></div><div class="admin">Admin</div></div></header><main><div class="circle"></div><div class="content"><img class="hero-logo" src="../../public/bndr-logo-black.png" alt="BNDR"><div class="tagline">A source-backed directory of victim, advocacy &amp; family-court resources.</div><div class="search">Search resources, organizations, topics…</div><div class="meta"><div class="pill">114 resources indexed</div><div class="pill">Priority resources</div></div></div></main></body></html>
