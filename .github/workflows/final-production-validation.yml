name: Final production validation

on:
  push:
    branches:
      - ci/final-production-validation-20260920

permissions:
  contents: read

jobs:
  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build exact production Docker image
        run: docker build --progress=plain -t qr-resets-final .
